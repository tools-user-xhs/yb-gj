    // 场景映射 + 样板细节映射 (功能保留)
    const scenarioMap = {
        1: "✔️ 样板免费，运费客户出 → 适用场景：常规样品（货值较低），大部分公平场景，展示诚意同时筛选真实买家。客户承担运费表明重视程度。",
        2: "✔️ 样板费+运费均为客户出 → 适用场景：高价值定制样板（开模/特材），深度合作意向及防套板，技术壁垒产品首选。",
        3: "✔️ 双方均由公司承担 → 适用场景：全球战略级大客户，新品PR推广，预算充足下使用，需审批。",
        4: "✔️ 样板费客户出，运费公司出 → 适用场景：样板昂贵但运费较低/客户信誉优秀但运费预算紧张时提升谈判好感。"
    };
    const sampleDetailMap = {
        spec: "📏 规格尺寸确认：提供2D/3D图纸，公差范围(±0.1mm)，双方邮件回复书面确认，防止尺寸偏差。",
        material: "🧱 具体材质确认：明确材料牌号（如ABS、PC+ABS），提供物性表，并要求附材质证明报告。",
        pantone: "🎨 潘通色号确认：确定Pantone色号及光泽度（高光/哑光），必要时寄出A4色样双方签字封存。",
        qty: "🔢 样板所需数量：常规2~5pcs，如需破坏性测试或试装则增加备用样，明确大货订单返还规则。",
        receiver: "👥 收件人信息标准化：完整公司名+全名+电话+街道地址+邮编；邮箱采用有效性测试（发送测试信并确认无退信），多个收件人需独立包裹并标注对应SKU。"
    };

    let currentModuleId = '1';

    // 渲染模块，绑定每个section独立折叠 + 卡片交互 + 一键收起按钮
    function renderModule(moduleId) {
        const data = moduleData[moduleId];
        if (!data) return;
        // 构建头部（带一键收起按钮） 文字改为“一键收起”
        const headerHtml = `
            <div class="module-header-flex">
                <div class="module-title">${data.title}</div>
                <button class="collapse-all-btn" id="collapseAllBtn">📘 一键收起</button>
            </div>
        `;
        let sectionsHtml = '';
        data.sections.forEach((section, idx) => {
            const sectionId = `section_${moduleId}_${idx}`;
            sectionsHtml += `
                <div class="sop-section" data-section-id="${sectionId}">
                    <div class="section-header" data-toggle="${sectionId}">
                        <h3>${section.heading}</h3>
                        <span class="toggle-icon">−</span>
                    </div>
                    <div class="section-content" id="${sectionId}">
                        ${section.contentHtml}
                    </div>
                </div>
            `;
        });
        const fullHtml = headerHtml + sectionsHtml;
        document.getElementById('dynamicContent').innerHTML = fullHtml;

        // 绑定每个章节的折叠展开
        const sectionHeaders = document.querySelectorAll('.section-header');
        sectionHeaders.forEach(header => {
            const targetId = header.getAttribute('data-toggle');
            const contentDiv = document.getElementById(targetId);
            const iconSpan = header.querySelector('.toggle-icon');
            if (contentDiv) {
                contentDiv.classList.remove('collapsed');
                if (iconSpan) iconSpan.innerHTML = '−';
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isCollapsed = contentDiv.classList.contains('collapsed');
                    if (isCollapsed) {
                        contentDiv.classList.remove('collapsed');
                        if (iconSpan) iconSpan.innerHTML = '−';
                    } else {
                        contentDiv.classList.add('collapsed');
                        if (iconSpan) iconSpan.innerHTML = '+';
                    }
                });
            }
        });

        // 一键收起当前模块所有细节 (所有section-content折叠)
        const collapseBtn = document.getElementById('collapseAllBtn');
        if (collapseBtn) {
            const newBtn = collapseBtn.cloneNode(true);
            collapseBtn.parentNode.replaceChild(newBtn, collapseBtn);
            newBtn.addEventListener('click', () => {
                const allContents = document.querySelectorAll('#dynamicContent .section-content');
                allContents.forEach(content => {
                    content.classList.add('collapsed');
                });
                const allIcons = document.querySelectorAll('#dynamicContent .toggle-icon');
                allIcons.forEach(icon => {
                    icon.innerHTML = '+';
                });
            });
        }

        // 模块2: 协议谈判场景卡片交互
        if (moduleId === '2') {
            const cardsContainer = document.getElementById('feeScenarioCards');
            const scenarioDetailDiv = document.getElementById('scenarioDetailBox');
            if (cardsContainer && scenarioDetailDiv) {
                let activeScenarioKey = null;
                const clearDetail = () => { scenarioDetailDiv.innerHTML = ''; activeScenarioKey = null; };
                const showDetail = (text) => { scenarioDetailDiv.innerHTML = `<div>${text}</div>`; };
                const cards = cardsContainer.querySelectorAll('.option-card');
                cards.forEach(card => {
                    const scenarioVal = card.getAttribute('data-scenario');
                    card.style.cursor = 'pointer';
                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (activeScenarioKey === scenarioVal) {
                            clearDetail();
                        } else {
                            const desc = scenarioMap[scenarioVal] || "暂无详细说明";
                            showDetail(desc);
                            activeScenarioKey = scenarioVal;
                        }
                    });
                });
                scenarioDetailDiv.innerHTML = '';
            }
        }

        // 模块3: 样板细节 + 双保险 + 包装物流
        if (moduleId === '3') {
            const sampleCardsDiv = document.getElementById('sampleDetailsCards');
            const sampleDetailDiv = document.getElementById('sampleDetailDisplay');
            if (sampleCardsDiv && sampleDetailDiv) {
                let activeDetailKey = null;
                const clearDetail = () => { sampleDetailDiv.innerHTML = ''; activeDetailKey = null; };
                const setDetail = (text) => { sampleDetailDiv.innerHTML = `<div>${text}</div>`; };
                const detailCards = sampleCardsDiv.querySelectorAll('.option-card');
                detailCards.forEach(card => {
                    const detailKey = card.getAttribute('data-detail');
                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (activeDetailKey === detailKey) {
                            clearDetail();
                        } else {
                            const text = sampleDetailMap[detailKey] || "请确认具体参数标准";
                            setDetail(text);
                            activeDetailKey = detailKey;
                        }
                    });
                });
                sampleDetailDiv.innerHTML = '';
            }
            // 双保险按钮
            const insuranceBtn = document.getElementById('doubleInsuranceBtn');
            const insuranceDisplay = document.getElementById('insuranceDisplay');
            let insuranceActive = false;
            if (insuranceBtn && insuranceDisplay) {
                insuranceDisplay.innerHTML = '';
                insuranceBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!insuranceActive) {
                        insuranceDisplay.innerHTML = `<div><strong>📝 线上样板确认文档内容：</strong>包含样板高清照片、规格指标、色板编号、功能测试标准表。客户通过Docusign/邮件回复“样板确认无误”并存档，有效防止量产纠纷及不认账。签字确认后冻结所有参数。</div>`;
                        insuranceActive = true;
                    } else {
                        insuranceDisplay.innerHTML = '';
                        insuranceActive = false;
                    }
                });
            }
            // 包装物流
            const packBtn = document.getElementById('packShipBtn');
            const packDisplay = document.getElementById('packShipDisplay');
            let packActive = false;
            if (packBtn && packDisplay) {
                packDisplay.innerHTML = '';
                packBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!packActive) {
                        packDisplay.innerHTML = `<div><strong>📮 包装方式确认细节：</strong> 防静电/气泡膜+外箱抗压测试，干燥剂+防水标签。<br>
                        <strong>✈️ 寄件流程：</strong> 商业发票标注“样品”低价值，选择DHL/FedEx，预付关税可选。出单号后30分钟内WhatsApp/邮件发送单号+预计到达时间，清关文件同步附上。<br>
                        <strong>📲 闭环：</strong> 每日主动追踪物流状态直至妥投，并告知客户注意事项。</div>`;
                        packActive = true;
                    } else {
                        packDisplay.innerHTML = '';
                        packActive = false;
                    }
                });
            }
        }
    }

    // 模块激活 & 按钮高亮 + 箭头流式导航
    const btns = document.querySelectorAll('.module-btn');
    function setActiveModule(moduleId) {
        btns.forEach(btn => {
            if (btn.getAttribute('data-module') === moduleId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderModule(moduleId);
        currentModuleId = moduleId;
    }
    btns.forEach(btn => {
        btn.addEventListener('click', () => {
            const moduleVal = btn.getAttribute('data-module');
            if (moduleVal) setActiveModule(moduleVal);
        });
    });
    // 初始加载模块1
    setActiveModule('1');
</script>
</body>
</html>
